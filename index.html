<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>中古時計 相場ログ(準備中)</title>
<style>
:root{
  --bg:#f4f5f7; --surface:#ffffff; --ink:#1a1e24; --muted:#64707c;
  --line:#e3e7ec; --accent:#2f5fb3;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#14171b; --surface:#1d2127; --ink:#e7eaee; --muted:#98a2ad;
    --line:#2b313a; --accent:#5486dd;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:system-ui,"Segoe UI","Hiragino Sans","Yu Gothic UI",sans-serif;
  font-size:15px;line-height:1.7;display:flex;min-height:100vh;
  align-items:center;justify-content:center;padding:24px;}
main{max-width:480px;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:32px 28px;}
h1{font-size:19px;margin:0 0 4px;}
p{color:var(--muted);font-size:14px;margin:8px 0;}
.badge{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.03em;
  padding:3px 8px;border-radius:5px;background:rgba(47,95,179,.1);color:var(--accent);
  margin-bottom:14px;}
</style>
</head>
<body>
<main>
<span class="badge">準備中</span>
<h1>中古時計 相場ログ(仮称・非公式)</h1>
<p>中古ロレックスの出品価格を毎朝自動収集し、型番ごとの相場を公開する予定のページです。</p>
<p>データが十分に蓄積でき次第、このページを実際のダッシュボードに差し替えます。
現時点では相場データはまだ掲載していません。</p>
</main>
</body>
</html>
